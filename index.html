<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FCHS Course Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <img src="assets/logo.png" alt="Franklin Central High School" class="masthead-logo">
    <div>
      <h1>Course Catalog</h1>
      <p class="masthead-sub">2026&ndash;2027 &middot; browse every course, department by department</p>
    </div>
  </div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search courses&hellip;" autocomplete="off">
  </div>
</header>

<section class="schedule-tray" id="scheduleTray">
  <div class="schedule-tray-header">
    <h2>My Schedule</h2>
    <span class="schedule-count" id="scheduleCount">0 courses</span>
  </div>
  <div class="schedule-items" id="scheduleItems">
    <p class="schedule-empty">Select courses from the catalog below to build your schedule.</p>
  </div>
</section>

<div class="layout">
  <nav class="dept-rail" id="deptRail" aria-label="Departments">
    <!-- populated by app.js -->
  </nav>

  <main class="catalog" id="catalog">
    <!-- populated by app.js -->
  </main>
</div>

<div class="detail-panel" id="detailPanel">
  <button class="detail-close" id="detailClose" aria-label="Close">&times;</button>
  <div id="detailContent"></div>
  <button class="add-btn" id="addBtn">Add to Schedule</button>
</div>
<div class="scrim" id="scrim"></div>

<script src="app.js"></script>
</body>
</html>
